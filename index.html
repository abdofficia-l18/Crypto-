<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoHub - Live Cryptocurrency Prices</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #ffd700, #ff6b35, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .search-box {
            display: flex;
            max-width: 400px;
            margin: 0 auto 30px;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            backdrop-filter: blur(10px);
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-box button {
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ffd700, #ff6b35);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .search-box button:hover {
            transform: scale(1.05);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-10px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .crypto-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .crypto-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ffd700, #ff6b35, #4ecdc4);
        }

        .crypto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .crypto-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .crypto-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(45deg, rgba(255, 215, 0, 0.2), rgba(255, 107, 53, 0.2));
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .crypto-info h3 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .crypto-symbol {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .price-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .current-price {
            font-size: 2rem;
            font-weight: bold;
        }

        .change-24h {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .positive { color: #4ecdc4; }
        .negative { color: #ff4757; }

        .market-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 0.9rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .crypto-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: linear-gradient(45deg, #4ecdc4, #44bdad);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(78, 205, 196, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-coins"></i> CryptoHub</h1>
            <p>Real-time cryptocurrency prices and market data</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search cryptocurrencies...">
                <button onclick="searchCrypto()"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <div class="crypto-grid" id="cryptoGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading cryptocurrencies...
            </div>
        </div>

        <button class="refresh-btn" onclick="loadData()">
            <i class="fas fa-sync-alt"></i> Refresh Data
        </button>
    </div>

    <script>
        const cryptos = [
            { id: 'bitcoin', symbol: 'BTC', name: 'Bitcoin', icon: '₿' },
            { id: 'ethereum', symbol: 'ETH', name: 'Ethereum', icon: 'Ξ' },
            { id: 'binancecoin', symbol: 'BNB', name: 'BNB', icon: 'BNB' },
            { id: 'cardano', symbol: 'ADA', name: 'Cardano', icon: '₳' },
            { id: 'solana', symbol: 'SOL', name: 'Solana', icon: 'SOL' },
            { id: 'ripple', symbol: 'XRP', name: 'XRP', icon: '₿' },
            { id: 'polkadot', symbol: 'DOT', name: 'Polkadot', icon: '●' },
            { id: 'dogecoin', symbol: 'DOGE', name: 'Dogecoin', icon: 'Ð' }
        ];

        let allCryptoData = [];

        async function fetchCryptoPrice(id) {
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd&include_24hr_change=true&include_market_cap=true&include_24hr_vol=true`);
                const data = await response.json();
                return data[id];
            } catch (error) {
                console.error('Error fetching price:', error);
                return null;
            }
        }

        async function loadCryptoData() {
            const grid = document.getElementById('cryptoGrid');
            grid.innerHTML = '';

            for (const crypto of cryptos) {
                const priceData = await fetchCryptoPrice(crypto.id);
                if (priceData) {
                    allCryptoData.push({ ...crypto, ...priceData });
                    createCryptoCard(crypto, priceData);
                }
            }

            updateStats();
        }

        function createCryptoCard(crypto, data) {
            const grid = document.getElementById('cryptoGrid');
            const changeClass = data.usd_24h_change > 0 ? 'positive' : 'negative';
            const changeIcon = data.usd_24h_change > 0 ? 'fas fa-arrow-up' : 'fas fa-arrow-down';

            const card = document.createElement('div');
            card.className = 'crypto-card';
            card.innerHTML = `
                <div class="crypto-header">
                    <div class="crypto-icon">
                        <i style="font-size: 28px;">${crypto.icon}</i>
                    </div>
                    <div class="crypto-info">
                        <h3>${crypto.name}</h3>
                        <div class="crypto-symbol">${crypto.symbol}</div>
                    </div>
                </div>
                <div class="price-section">
                    <div class="current-price">$${data.usd?.toLocaleString() || 'N/A'}</div>
                    <div class="change-24h ${changeClass}">
                        <i class="${changeIcon}"></i> ${data.usd_24h_change?.toFixed(2)}%
                    </div>
                </div>
                <div class="market-stats">
                    <div class="stat-item">
                        <span class="stat-label">Market Cap</span>
                        <span>$${data.usd_market_cap?.toLocaleString() || 'N/A'}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">24h Volume</span>
                        <span>$${data.usd_24h_vol?.toLocaleString() || 'N/A'}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        }

        function updateStats() {
            const totalMarketCap = allCryptoData.reduce((sum, crypto) => sum + (crypto.usd_market_cap || 0), 0);
            const totalVolume = allCryptoData.reduce((sum, crypto) => sum + (crypto.usd_24h_vol || 0), 0);
            const avgChange = allCryptoData.reduce((sum, crypto) => sum + (crypto.usd_24h_change || 0), 0) / allCryptoData.length;

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">$${totalMarketCap.toLocaleString()}</div>
                    <div class="stat-label">Total Market Cap</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">$${totalVolume.toLocaleString()}</div>
                    <div class="stat-label">24h Trading Volume</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${avgChange.toFixed(2)}%</div>
                    <div class="stat-label">Avg 24h Change</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${allCryptoData.length}</div>
                    <div class="stat-label">Cryptocurrencies</div>
                </div>
            `;
        }

        function searchCrypto() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.crypto-card');
            
            cards.forEach(card => {
                const name = card.querySelector('h3').textContent.toLowerCase();
                const symbol = card.querySelector('.crypto-symbol').textContent.toLowerCase();
                
                if (name.includes(query) || symbol.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function loadData() {
            loadCryptoData();
        }

        // Initialize
        loadData();

        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);

        // Search on Enter
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchCrypto();
            }
        });
    </script>
</body>
</html>
